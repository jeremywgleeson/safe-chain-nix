name: Update Safe Chain

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update package
        run: nix develop --command scripts/update-safe-chain

      - name: Open pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/update-safe-chain
          commit-message: "chore: update safe-chain"
          title: "chore: update safe-chain"
          body: |
            Automated Safe Chain source package update.

            This PR was generated by the scheduled update workflow and validated with `nix flake check`.
          labels: dependencies
